name: Release Assets

# WHAT A RELEASE CARRIES, AND WHO CAN PROVE IT.
#
# A tag is a name, and a name can be moved. Until 24 September 2026 a release
# here was a tag and its notes, and a person deploying it had nothing to
# check except that the tag existed. This job gives every release an archive
# of exactly the tree the tag points at, a signature over it, and a SLSA
# provenance statement of how it was built, all three made by this workflow
# on GitHub's runner with a short-lived identity and no stored key:
#
#   <repo>-<tag>.tar.gz              git archive of the tag
#   <repo>-<tag>.tar.gz.sigstore.json  cosign keyless signature (Sigstore bundle)
#   <repo>-<tag>.intoto.jsonl        SLSA v1 build provenance, by the SLSA generator
#
# Verifying, from any machine, with nothing from this repository trusted:
#
#   cosign verify-blob <repo>-<tag>.tar.gz \
#     --bundle <repo>-<tag>.tar.gz.sigstore.json \
#     --certificate-identity https://github.com/heyvaldemar/<repo>/.github/workflows/release-assets.yml@refs/tags/<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
#   slsa-verifier verify-artifact <repo>-<tag>.tar.gz \
#     --provenance-path <repo>-<tag>.intoto.jsonl \
#     --source-uri github.com/heyvaldemar/<repo> --source-tag <tag>
#
# THE IDENTITY IS EXACT. It names this file and the ref the signing run ran
# on, and nothing looser. Until 16 November 2026 it was a prefix,
# '^https://github.com/heyvaldemar/<repo>/', and any workflow in the
# repository matched it: a signature made by some other workflow, on any
# branch, verified as a release. A release run runs on the tag, so the
# identity ends in @refs/tags/<tag>, and its provenance names the tag.
#
# Started by hand with a tag, it signs an existing release: that is how the
# releases before this job existed got the same three files. Such a run
# runs on the branch it was started from, so it is refused anywhere but
# main. Its identity ends in @refs/heads/main, and its provenance needs
# --source-branch main where a release run's needs --source-tag.
#
# The last job runs both commands itself, on the files the release now
# holds. It also shows each command a copy of the archive with one byte
# appended, and each must refuse it for that reason, in its own words. A
# refusal for any other reason (no network, Sigstore unreachable, a tool
# missing) proves nothing, and the job fails on it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to give an archive, a signature and provenance"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  archive:
    name: Archive the tag and sign it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - name: Which tag
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Provenance names the ref this run ran on. A run started by hand
            # from a feature branch would attach to the release a statement
            # that it was built from that branch, signed by that branch's copy
            # of this file. So it runs from main or not at all.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::started from $GITHUB_REF: a release is signed only from refs/heads/main, start it from main"
              exit 1
            fi
            # A run by hand is for a release with no files yet. One that has
            # them was signed on its tag, and the upload below replaces files
            # of the same name: the signature would then name main, and
            # everyone who checks the tag's identity, as the README says,
            # would be refused. To replace them, delete the three files first.
            if ! names="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"; then
              echo "::error::release $TAG could not be read, so it cannot be told whether it is already signed"
              exit 1
            fi
            if printf '%s\n' "$names" | grep -qxF "${GITHUB_REPOSITORY#*/}-$TAG.tar.gz.sigstore.json"; then
              echo "::error::$TAG already carries its signature; a run by hand would replace it with one made on main. Delete the three files first if they are to be replaced"
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REPOSITORY#*/}-$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Archive exactly what the tag points at
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          mkdir -p out
          # git archive, not tar of the checkout: no .git, no runner files, and
          # the same bytes for the same tag on any machine.
          git archive --format=tar.gz --prefix="$NAME/" -o "out/$NAME.tar.gz" "refs/tags/$TAG"
          ls -l out

      - name: Sign it, keyless
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          cosign sign-blob --yes "out/$NAME.tar.gz" --bundle "out/$NAME.tar.gz.sigstore.json"
          # Verify what was just signed before publishing it: a signature that
          # does not verify here would not verify for anyone.
          cosign verify-blob "out/$NAME.tar.gz" --bundle "out/$NAME.tar.gz.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-assets.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Hash it for the provenance
        id: hash
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          cd out
          echo "subjects=$(sha256sum "$NAME.tar.gz" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attach the archive and the signature to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
        run: gh release upload "$TAG" "out/$NAME.tar.gz" "out/$NAME.tar.gz.sigstore.json" --clobber

  provenance:
    name: SLSA provenance
    needs: archive
    permissions:
      actions: read
      id-token: write
      contents: write
    # Referenced by tag, and this is the one line in the fleet that is. The
    # generator halts when referenced by commit (tested on 2026-09-24: it
    # then reports the repository as private and stops, to keep a name out of
    # the transparency log), and OpenSSF Scorecard scores this line as an
    # unpinned dependency, 8 of 10, on every repository that carries it. The
    # evidence page says so beside the score.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.archive.outputs.subjects }}
      provenance-name: ${{ github.event.repository.name }}-${{ needs.archive.outputs.tag }}.intoto.jsonl
      # Not the generator's own upload: it edits the release to attach the
      # file, and GitHub refuses that edit with the workflow token when the
      # release targets a commit rather than a branch, which every release cut
      # from a verified commit here does. Fourteen repositories found that out
      # on 2026-09-24. The job below only adds an asset, which is allowed.
      upload-assets: false

  attach:
    name: Attach the provenance to the release
    needs: [archive, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the signed provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: out

      - name: Attach it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.archive.outputs.tag }}
          NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          ls -l out
          gh release upload "$TAG" "out/$NAME" --clobber

  verify:
    name: Verify the release as a stranger would
    needs: [archive, attach]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The two commands the header gives anyone, run on what the release now
    # holds, downloaded from it rather than handed over by the jobs above:
    # until 27 October 2026 nothing in CI checked the provenance, so a
    # release whose provenance did not verify would have looked like any
    # other. Each check is also shown a violation, the same archive with one
    # byte appended, which both must refuse; a check never seen to fail
    # proves nothing.
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download the three files from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.archive.outputs.tag }}
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-$TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D out \
            -p "$NAME.tar.gz" -p "$NAME.tar.gz.sigstore.json" -p "$NAME.intoto.jsonl"
          ls -l out

      - name: Verify the signature and the provenance, and that a changed archive fails both
        env:
          TAG: ${{ needs.archive.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-$TAG"
          cd out
          # The one identity this run signed with: this file, on the ref the
          # run ran on (the tag for a release, main for a run started by hand).
          sig=(--certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-assets.yml@${GITHUB_REF}"
               --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          if [ "$EVENT" = release ]; then src=(--source-tag "$TAG"); else src=(--source-branch main); fi

          cosign verify-blob "$NAME.tar.gz" --bundle "$NAME.tar.gz.sigstore.json" "${sig[@]}"
          slsa-verifier verify-artifact "$NAME.tar.gz" --provenance-path "$NAME.intoto.jsonl" \
            --source-uri "github.com/$GITHUB_REPOSITORY" "${src[@]}"

          # refuses <tool> <its words for a changed artifact> <command...>
          # The changed archive must be refused, and refused because it
          # changed. A tool that cannot reach Sigstore, or is not installed,
          # also exits non-zero, and until 16 November 2026 this step read
          # that as a refusal and went green with nothing checked. The words
          # are those of cosign v3.1 and slsa-verifier v2.7: a tool update
          # that rewords them turns this red, which is the safe way to find out.
          refuses() {
            local tool="$1" words="$2" out rc=0
            shift 2
            out="$("$@" 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::$tool accepted the archive with one byte appended"; exit 1
            fi
            case "$out" in
              *"$words"*) echo "$tool refused the changed archive: $words" ;;
              *) printf '%s\n' "$out" | tail -n 5
                 echo "::error::$tool exited $rc on the changed archive without saying it changed; a refusal for another reason proves nothing"
                 exit 1 ;;
            esac
          }
          cp "$NAME.tar.gz" changed.tar.gz
          printf 'x' >> changed.tar.gz
          refuses cosign "invalid signature when validating ASN.1 encoded signature" \
            cosign verify-blob changed.tar.gz --bundle "$NAME.tar.gz.sigstore.json" "${sig[@]}"
          refuses slsa-verifier "artifact hash does not match provenance subject" \
            slsa-verifier verify-artifact changed.tar.gz --provenance-path "$NAME.intoto.jsonl" \
              --source-uri "github.com/$GITHUB_REPOSITORY" "${src[@]}"
          echo "the release verifies, and a changed copy of its archive is refused for being changed"
