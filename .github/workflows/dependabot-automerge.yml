name: Dependabot auto-merge

# Merges a Dependabot pull request once this repository's own verification has
# finished GREEN for that commit — and only then.
#
# NOT `gh pr merge --auto`. That hands the decision to GitHub's auto-merge,
# which waits for the checks a branch protection rule marks as REQUIRED. Where
# no rule marks any, nothing is required, and auto-merge merges the pull
# request immediately — before the verification it was supposed to wait for.
# Triggering on the verification's own completion removes that dependency: if
# the run did not conclude success, this job does nothing at all.
on:
  workflow_run:
    workflows: ["Deployment Verification"]
    types: [completed]

# READ AT THE TOP, WRITE ONLY WHERE IT IS USED. A top-level block applies to
# every job in the file, including ones added later; OpenSSF Scorecard scores
# that as Token-Permissions 0/10 and it is right to. The merge job below is
# the only thing here that writes anything.
permissions:
  contents: read

jobs:
  merge:
    name: Merge the update if its verification passed
    permissions:
      contents: write
      pull-requests: write
      # To dispatch the verification on main once the merge is in.
      actions: write
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge, if this was Dependabot and the run was green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # The pull requests the run was for, its branch and who started it.
          # Through the environment, never pasted into the script: a branch name
          # is text whoever opens a pull request chooses.
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          VERIFY: ${{ github.event.workflow_run.path }}
        run: |
          # THE PULL REQUEST COMES FROM THE EVENT, AND THE COMMIT IS ONLY THE
          # FALLBACK. This used to ask which pull request carries the commit, and
          # on 2026-11-11 GitHub answered nothing five minutes after
          # siyuan-docker-compose#8 opened: the job said "nothing to do", went
          # green, and the update waited sixty hours. The event lists the pull
          # requests the run was for; the commit is asked about only when that
          # list is empty, six times, twenty seconds apart.
          pr="$(jq -r '.[0].number // empty' <<<"$PRS" 2>/dev/null || true)"
          tries=0
          while [ -z "$pr" ] && [ "$tries" -lt 6 ]; do
            if [ "$tries" -gt 0 ]; then sleep 20; fi
            tries=$((tries + 1))
            pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          done
          if [ -z "$pr" ]; then
            # A run Dependabot started with no pull request to be found is a
            # failure, not "nothing to do": the update would wait where nobody looks.
            if [ "$ACTOR" = "dependabot[bot]" ] && [ "${HEAD_BRANCH#dependabot/}" != "$HEAD_BRANCH" ]; then
              echo "::error::verification passed at $SHA on $HEAD_BRANCH, and no pull request was found for it, in the event or in six lookups"
              exit 1
            fi
            echo "no pull request at $SHA: nothing to do"
            exit 0
          fi
          # WHAT MAY BE MERGED IS DECIDED BY THE PULL REQUEST, NOT BY THE EVENT.
          # Its author must be Dependabot and its head the commit that was
          # verified. A head that moved since is a commit nothing here has run:
          # the run on that head decides instead.
          info="$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.state) \(.user.login) \(.head.sha)"')" \
            || { echo "::error::#$pr could not be read"; exit 1; }
          read -r state author head <<<"$info"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "#$pr is $author's, not Dependabot's: not merging"
            exit 0
          fi
          if [ "$state" != open ]; then
            echo "#$pr is $state: nothing to merge"
            exit 0
          fi
          if [ "$head" != "$SHA" ]; then
            echo "::warning::#$pr is at $head now, and the run that passed was for $SHA: not merging"
            exit 0
          fi
          echo "verification passed for #$pr; merging"
          # Squash where the repository allows it, a plain merge where it does
          # not. A repository with squash disabled would otherwise fail here
          # every week, and a job that fails every week is one nobody reads.
          # --match-head-commit: GitHub refuses the merge if the head moved after
          # the check above, so what lands is the commit that was verified.
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA" \
            || gh pr merge "$pr" --repo "$REPO" --merge --delete-branch --match-head-commit "$SHA"
          # THE MERGE IS PUSHED WITH GITHUB_TOKEN, AND GITHUB RUNS NO WORKFLOWS
          # FOR PUSHES MADE WITH IT. So main would land with no checks on its
          # head: the pull request was verified, the merge result was not, and
          # the repository page would show its latest commit with no tick. On
          # 2026-09-17 that was fourteen repositories out of ninety-four, up
          # from four two days earlier, growing with every merge.
          #
          # workflow_dispatch is the documented exception to that rule. The
          # verification this job was waiting on is asked to run again, on main
          # as merged. The file to dispatch comes from the event, not a guess.
          gh workflow run "$(basename "$VERIFY")" --repo "$REPO" --ref main
          echo "verification dispatched on main as merged"
