# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# NOTE: no `docker` ecosystem here on purpose. Dependabot's docker ecosystem
# only parses Dockerfiles and compose files with literal `image:` values —
# this repo's compose file uses `image: ${VAR}` with the pins living in
# .env.example, which Dependabot cannot see. The earlier `docker` entry
# scanned nothing and quietly let the Keycloak pin go stale (issue #40).
# Pin freshness is enforced instead by the weekly `check-pin-freshness` job
# in .github/workflows/deployment-verification.yml.
